[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-adlc"
version = "0.1.0"
description = "Graph-driven Agentic Development Lifecycle: v0.1 proof of concept"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gadlc = "graph_adlc.cli:main"

[tool.setuptools]
packages = ["graph_adlc"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
