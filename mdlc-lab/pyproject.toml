[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlc-lab"
version = "0.1.0"
description = "Hands-on MDLC lab: building a sentiment classifier end to end"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "torch>=2.1",
]

[project.scripts]
lab = "mdlc.lab:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbformat>=5.9", "nbconvert>=7.0", "ipykernel>=6.0"]

[tool.setuptools]
packages = ["mdlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
