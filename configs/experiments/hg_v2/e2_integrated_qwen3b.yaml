# HG-v2 E2/E3 on a frozen off-the-shelf LM -- the run that evaluates H1 and H2.
#
# Same task, arms and metrics as e2_integrated_sim.yaml; the difference is that
# the primary model is real, the router's features come from that model's own
# behaviour, and the queries are synthesized by the same frozen weights that
# have to make the decision. Requires a GPU (see the DGX Spark section of
# experiments/hg_v2/README.md).
name: hg_v2_e2_integrated_qwen3b

task:
  kind: route_choice_integrated
  # Half fits the router and half scores it, so the arms are evaluated on 500
  # items. At that size the standard error on an accuracy is ~0.022.
  n_items: 1000
  p_a_faster: 0.5
  p_accepts: 0.5
  # Which label carries the concession. At 0.5 the marginal over correct
  # actions is symmetric, so a model with a label bias scores chance rather
  # than 0.75. See the note in route_choice.py: this is a measured confound.
  p_concession_on_a: 0.5
  variables:
    - mountain_roads
    - toll_roads
    - ferry_crossings
    - night_driving
    - unpaved_roads

policies:
  # --- the factorial (plan section 7) --------------------------------------
  - b0_no_grounding
  - b1_self_consistency
  - b2_generic_ask
  - b3_oracle_route_oracle_query
  - b4_always_ask_synth
  - b5_learned_route_synth
  - b6_learned_route_oracle_query
  - b7_oracle_route_synth
  # --- E3, the minimality interventions (plan section 9) -------------------
  # Q0 is the comparator and is the same synthesizer B4 uses, so its arm and
  # b4_always_ask_synth measure the same thing by construction. Both are kept:
  # the duplication costs nothing (the counterfactual is computed once) and it
  # makes the E3 table readable on its own.
  - e3_q0_baseline
  - e3_q1_minimality
  - e3_q2_budget
  - e3_q3_hard_cap

# Which variant B4, B5 and B7 use. The unmodified one, so the factorial
# reproduces Phase 2's B4 rather than quietly measuring an intervention.
query_variant: q0_baseline

backend: transformers
backend_options:
  # The model gate G2 was measured on, so E2 is a paired before/after rather
  # than a new comparison. NOT 1.5B: it is below this task's capability floor
  # (plan section 2.4) -- it answers the same label on every item.
  checkpoint: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  device_map: cuda
  # Rank the two allowed labels by continuation log-probability instead of
  # generating: it removes the parser as a source of variance in the decision
  # arms and yields a real class distribution, which the router's
  # `label_margin` and `top_label_prob` features are built from. The
  # self-consistency and query-synthesis passes switch to sampled generation.
  scoring_mode: rank
  batch_size: 16
  max_input_tokens: 1024

self_consistency_samples: 5
temperature: 0.7
max_new_tokens: 8

synthesizer:
  # The primary model is asked what it needs to know, and its answer is parsed
  # into a QuerySpec directly comparable to the gold one. The variant supplies
  # the prompt and the cap policy; everything else is shared across variants so
  # a difference between them is attributable to the intervention.
  kind: lm
  max_new_tokens: 48
  temperature: 0.0
  # A query that cannot be parsed falls back to generic escalation: the
  # conservative choice, and deliberately unflattering.
  on_parse_failure: generic

router:
  learning_rate: 0.5
  n_steps: 2000
  l2: 0.0001

# Dense, per plan section 13: a coarse price sweep can hide estimator error
# inside a threshold window. Costs nothing here -- the counterfactuals are
# measured once and every price is a repricing of the same episodes.
lambda_grid: [0.01, 0.02, 0.05, 0.08, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50]

train_fraction: 0.5
seed: 0
n_bootstrap: 1000
alpha: 0.05
output_root: results

gate:
  # How much worse an arm's final loss may be than its comparator's and still
  # count as matched distortion. Wider than Phase 2's 0.01 because these arms
  # are scored on 500 items rather than 1000, where the standard error on a
  # loss difference is about 0.02.
  distortion_tolerance: 0.02
  min_winning_lambdas: 2
  max_soundness_loss: 0.05
